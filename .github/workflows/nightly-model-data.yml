name: Nightly model data

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly-model-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:refresh
      # GITHUB_TOKEN-created PRs do not trigger another workflow. Validate here first.
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Open or update the data refresh PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/model-data
          title: 'chore: refresh model benchmark data'
          commit-message: 'chore: refresh model benchmark data'
          draft: false
          add-paths: |
            src/data/benchmarks.json
            src/data/changelog.json
          body: |
            New or changed model data is available from the upstream Slopalytics snapshot.

            Updates the benchmark data and records added, updated, and removed model configurations in the changelog. The separate Ultrafast measurement stays unchanged.

            The nightly job passed type checking, tests, and a production build before opening this PR. See the workflow run summary for change counts.

            After merging, rebuild the local site to publish the update.

            Generated by the nightly GitHub Actions refresh script. No model generated these data changes.
