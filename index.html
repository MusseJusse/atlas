<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1f4fa" />
    <script>
      try {
        if (localStorage.getItem('benchmark-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').content = '#131c2b';
        }
      } catch {
        // Use the default light theme when storage is unavailable.
      }
    </script>
    <meta
      name="description"
      content="Compare AI model intelligence, cost per task, token use, and time per task."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/src/assets/dm-sans-ui.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Atlas · AI model benchmarks</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
